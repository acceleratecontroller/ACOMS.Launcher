<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Lock the page down: only our own inline styles/scripts, no remote loads. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <title>ACOMS Launcher</title>
    <link rel="stylesheet" href="picker.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__row">
        <div>
          <h1>ACOMS Launcher</h1>
          <p id="subtitle" class="subtitle">Pick a portal to open</p>
        </div>
        <button
          id="settings-toggle"
          class="iconbtn"
          type="button"
          title="Notification settings"
          aria-label="Notification settings"
          aria-expanded="false"
        >
          ⚙
        </button>
      </div>
    </header>

    <section id="settings-panel" class="settings" aria-label="Notification settings" hidden>
      <!-- Mute list + quiet hours are rendered by picker.js -->
    </section>

    <section id="quicknote-slot" class="quicknote-slot" aria-label="Quick note">
      <!-- Quick Note button is rendered by picker.js -->
    </section>

    <main id="portal-list" class="portal-list" aria-live="polite">
      <!-- Cards are rendered by picker.js -->
    </main>

    <footer class="footer">
      <span class="legend"><span class="dot dot--open"></span> currently open</span>
      <span id="update-slot" class="update">
        <!-- Version + update status is rendered by picker.js -->
      </span>
    </footer>

    <script src="picker.js"></script>
  </body>
</html>
