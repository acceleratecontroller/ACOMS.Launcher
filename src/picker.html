<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Lock the page down: only our own inline styles/scripts, no remote loads. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <title>ACOMS Launcher</title>
    <link rel="stylesheet" href="picker.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__row">
        <div>
          <h1>ACOMS Launcher</h1>
          <p id="subtitle" class="subtitle">Pick a portal to open</p>
        </div>
        <div class="header__actions">
        <!-- Next RDO and next public holiday (within a month), rendered by picker.js. -->
        <div id="key-dates" class="keydates" aria-label="Next RDO and public holiday"></div>
        <button id="calendar-open" class="iconbtn iconbtn--svg" type="button" title="Calendar" aria-label="Calendar" hidden>
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <rect x="1.5" y="2.5" width="13" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.3" />
            <path d="M1.5 6h13M5 1v3M11 1v3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
            <rect x="4" y="8.2" width="2.2" height="2.2" rx="0.4" fill="currentColor" />
            <rect x="6.9" y="8.2" width="2.2" height="2.2" rx="0.4" fill="currentColor" />
            <rect x="9.8" y="8.2" width="2.2" height="2.2" rx="0.4" fill="currentColor" />
          </svg>
        </button>
        <button
          id="settings-toggle"
          class="iconbtn"
          type="button"
          title="Notification settings"
          aria-label="Notification settings"
          aria-expanded="false"
        >
          ⚙
        </button>
        </div>
      </div>
    </header>

    <section id="settings-panel" class="settings" aria-label="Notification settings" hidden>
      <!-- Mute list + quiet hours are rendered by picker.js -->
    </section>

    <section id="leave-slot" class="leave-slot" aria-label="Upcoming leave">
      <!-- Who is on leave soon is rendered by picker.js. Nobody off: nothing at all. -->
    </section>

    <!-- Everyone's upcoming leave, over the top of the picker; a click on the strip opens it. -->
    <section id="leave-panel" class="leavepanel" aria-label="Everyone's upcoming leave" hidden>
      <div class="leavepanel__head">
        <h2>Upcoming leave</h2>
        <button id="leave-panel-close" class="iconbtn" type="button" title="Close" aria-label="Close">&#x2715;</button>
      </div>
      <div id="leave-panel-list" class="leavepanel__list"></div>
      <div class="leavepanel__foot">
        <button id="leave-panel-open" class="leavepanel__open" type="button">Open leave requests</button>
      </div>
    </section>

    <main id="portal-list" class="portal-list" aria-live="polite">
      <!-- Cards are rendered by picker.js -->
    </main>

    <footer class="footer">
      <span class="legend"><span class="dot dot--open"></span> currently open</span>
      <span id="update-slot" class="update">
        <!-- Version + update status is rendered by picker.js -->
      </span>
    </footer>

    <script src="picker.js"></script>
  </body>
</html>
