<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Same lock-down as chat: our own files only, no remote loads. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <title>ACOMS Tasks</title>
    <link rel="stylesheet" href="tasks.css" />
  </head>
  <body>
    <header class="top">
      <nav class="tabs" role="tablist" aria-label="Task Manager">
        <!-- The page's order: ACOMS Tasks, Quick Tasks, Recurring, Quick Notes. -->
        <button id="tab-acoms" class="tab" type="button" role="tab" data-tab="acoms">
          ACOMS Tasks <span id="badge-acoms" class="tab__badges"></span>
        </button>
        <button id="tab-quick" class="tab tab--on" type="button" role="tab" data-tab="quick">
          Quick Tasks <span id="badge-quick" class="tab__badges"></span>
        </button>
        <button id="tab-recurring" class="tab" type="button" role="tab" data-tab="recurring">
          Recurring Tasks <span id="badge-recurring" class="tab__badges"></span>
        </button>
        <button id="tab-notes" class="tab" type="button" role="tab" data-tab="notes">
          Quick Notes <span id="badge-notes" class="tab__badges"></span>
        </button>
      </nav>
      <p id="me" class="top__me"></p>
    </header>

    <div id="notice" class="notice" hidden></div>
    <div id="action-error" class="action-error" hidden></div>

    <!-- ── Quick Tasks ─────────────────────────────────────────────────── -->
    <section id="pane-quick" class="pane pane--quick">
      <div class="qbar">
        <form id="quick-add" class="qfield qfield--add">
          <svg class="qfield__icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M7 2v10M2 7h10" /></svg>
          <input
            id="quick-add-input"
            type="text"
            maxlength="300"
            autocomplete="off"
            aria-label="Add a task"
            placeholder="Add a task and press Enter, e.g. ring Bob friday A1209 !"
          />
          <button class="qfield__hint" type="button" id="add-task" title="Open the full form (Ctrl+N)">Full form</button>
        </form>
        <label class="qfield qfield--search">
          <svg class="qfield__icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="4.2" /><path d="M9.2 9.2L12.5 12.5" /></svg>
          <input id="quick-search" type="text" autocomplete="off" aria-label="Search tasks" placeholder="Search title, job, label, notes" />
          <span class="qfield__hint">Ctrl+F</span>
        </label>
      </div>
      <div id="quick-preview" class="qpreview" hidden></div>
      <div class="qtools">
        <div id="chips" class="qchips"></div>
        <span class="qtools__grow"></span>
        <button id="replan-btn" class="qbtn qbtn--accent" type="button" hidden></button>
        <div class="seg">
          <button id="quick-view-list" class="seg__btn" type="button">List</button>
          <button id="quick-view-week" class="seg__btn" type="button">Week</button>
        </div>
        <select id="group-by" class="select" aria-label="Group by">
          <option value="due">Group: Due date</option>
          <option value="job">Group: Job</option>
          <option value="label">Group: Label</option>
        </select>
        <select id="owner-filter" class="select" aria-label="Owner"></select>
        <button id="toggle-archived" class="qbtn" type="button">Archived</button>
      </div>
      <div class="qbody">
        <div id="task-list" class="qlist"></div>
        <aside id="task-panel" class="qpanel" aria-label="Task detail" hidden></aside>
      </div>
      <div id="quick-foot" class="qfoot"></div>
    </section>

    <!-- ── ACOMS Tasks (the company queue) ─────────────────────────────── -->
    <section id="pane-acoms" class="pane" hidden>
      <div id="area-head" class="area-head" hidden></div>
      <div id="company-toolbar" class="toolbar">
        <div id="company-chips" class="chips"></div>
        <button id="toggle-done-company" class="chip" type="button">Show done</button>
      </div>
      <p id="company-note" class="pane__note" hidden>Only admins and managers can take a task from this list for now.</p>
      <div id="company-list" class="list"></div>
      <div id="routine-cards" class="routine" hidden></div>
    </section>

    <!-- ── Recurring Tasks ─────────────────────────────────────────────── -->
    <section id="pane-recurring" class="pane" hidden>
      <div class="toolbar">
        <button class="btn btn--primary" type="button" id="add-recurring">+ Add Recurring Task</button>
        <button id="toggle-archived-recurring" class="btn btn--ghost" type="button">Active</button>
        <div class="seg">
          <button id="rec-view-list" class="seg__btn seg__btn--on" type="button">List</button>
          <button id="rec-view-cal" class="seg__btn" type="button">Calendar</button>
        </div>
        <div id="rec-chips" class="chips"></div>
        <select id="rec-more-filter" class="select" aria-label="More filters">
          <option value="all">All Tasks</option>
          <option value="on-track">On Track</option>
        </select>
        <select id="rec-owner-filter" class="select" aria-label="Owner"></select>
      </div>
      <div id="recurring-list" class="list"></div>
    </section>

    <!-- ── Quick Notes ─────────────────────────────────────────────────── -->
    <section id="pane-notes" class="pane" hidden>
      <div class="toolbar">
        <button class="btn btn--primary" type="button" id="add-note">+ Add Quick Note</button>
        <button id="toggle-archived-notes" class="btn btn--ghost" type="button">Active</button>
      </div>
      <div id="note-grid" class="notes"></div>
    </section>

    <!-- Dialogs: task form, note editor, confirm. Drawn by tasks-window.js. -->
    <div id="dialog" class="dialog" hidden></div>

    <script src="chat-task-parse.js"></script>

    <script src="tasks-rules.js"></script>
    <script src="tasks-window.js"></script>
    <script src="tasks-quick.js"></script>
  </body>
</html>
